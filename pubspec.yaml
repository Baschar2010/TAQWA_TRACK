name: taqwa_track
description: Offline-first prayer, habit, and family tracker.
publish_to: none
version: 1.9.0+14

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  adhan: ^2.0.0+1
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^5.1.1
  geolocator: ^14.1.2
  hijri: ^3.0.1
  http: ^1.6.0
  intl: ^0.20.2
  just_audio: ^0.10.6
  mobile_scanner: ^7.4.3
  path: ^1.9.1
  qr_flutter: ^4.1.0
  sensors_plus: ^7.1.1
  sqflite: ^2.4.5
  sqflite_common_ffi_web: ^1.2.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  workmanager: ^0.10.10

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/data/
    - assets/quran/
    - assets/audio/
